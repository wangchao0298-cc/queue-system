<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排队查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orangeText: '#ff7a38',
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background: #fff1e9;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        /* 进度条样式（和截图对齐） */
        .progress-outer {
            position: relative;
            width: 100%;
            height: 34px;
        }
        .progress-gray-track {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 5px;
            background: #e8e8e8;
            border-radius: 999px;
            z-index: 0;
        }
        .progress-orange-fill {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 5px;
            background: #ff7a38;
            border-radius: 999px;
            z-index: 1;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-steps {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            z-index: 2;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #ff7a38;
            box-sizing: border-box;
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -14px;
        }
        .circle-done {
            background: #ff7a38;
            color: #fff;
        }
        .circle-current {
            background: #ff7a38;
            border-color: #ff7a38;
        }
        .circle-inner {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
        }
        .circle-todo {
            background: #fff;
            border-color: #e8e8e8;
        }
        .step-label {
            margin-top: 9px;
            font-size: 14px;
            color: #666;
        }
        .step-label-active {
            color: #ff7a38;
            font-weight: 600;
        }
    </style>
</head>
<body class="max-w-md mx-auto p-4">
    <div class="bg-white rounded-xl p-5 shadow">
        <h2 class="text-lg font-bold text-center mb-4">排队查询</h2>
        <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">输入验证码</label>
            <input id="queryCode" class="w-full border rounded-lg px-3 py-2" placeholder="请输入验证码">
        </div>
        <button onclick="queryInfo()" class="w-full bg-orangeText text-white py-2 rounded-lg">查询</button>
        <div id="resultBox" class="hidden mt-5">
            <div class="border-b pb-3 mb-4">
                <p class="text-gray-700">桌号：<span id="resNo"></span></p>
                <p class="text-gray-700">提示：<span id="resTip"></span></p>
                <p class="text-gray-700">取号时间：<span id="resTime"></span></p>
            </div>
            <!-- 进度条区域 -->
            <div class="progress-outer">
                <div class="progress-gray-track"></div>
                <div class="progress-orange-fill" id="progressFill"></div>
                <div class="progress-steps">
                    <div class="step">
                        <div class="circle" id="c0"></div>
                        <span class="step-label" id="l0">取号成功</span>
                    </div>
                    <div class="step">
                        <div class="circle" id="c1"></div>
                        <span class="step-label" id="l1">待叫号</span>
                    </div>
                    <div class="step">
                        <div class="circle" id="c2"></div>
                        <span class="step-label" id="l2">已就餐</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
async function queryInfo(){
    const code = document.getElementById('queryCode').value.trim();
    if(!code){alert('请输入验证码');return;}
    try{
        const res = await fetch('/api/list');
        const list = await res.json();
        const item = list.find(x=>x.code === code && x.enabled);
        if(!item){
            alert('未找到该排队信息或已失效');
            return;
        }
        document.getElementById('resultBox').classList.remove('hidden');
        document.getElementById('resNo').innerText = item.no;
        document.getElementById('resTip').innerText = item.tip;
        document.getElementById('resTime').innerText = item.takeTime;
        setProgress(item.status ?? 0);
    }catch(e){
        alert('查询失败：'+e.message);
    }
}

function setProgress(status) {
    const fill = document.getElementById('progressFill');
    const circleList = [document.getElementById('c0'), document.getElementById('c1'), document.getElementById('c2')];
    const labelList = [document.getElementById('l0'), document.getElementById('l1'), document.getElementById('l2')];
    const percentMap = [0, 50, 100];
    fill.style.width = percentMap[status] + '%';

    for(let i=0;i<3;i++){
        circleList[i].classList.remove('circle-done','circle-current','circle-todo');
        labelList[i].classList.remove('step-label-active');
        if(i < status){
            circleList[i].classList.add('circle-done');
            circleList[i].innerHTML = '<i class="fa fa-check text-white text-xs"></i>';
        }else if(i === status){
            circleList[i].classList.add('circle-current');
            circleList[i].innerHTML = '<div class="circle-inner"></div>';
            labelList[i].classList.add('step-label-active');
        }else{
            circleList[i].classList.add('circle-todo');
            circleList[i].innerHTML = '';
        }
    }
}
</script>
</body>
</html>
