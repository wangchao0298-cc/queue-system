<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排队后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orangeText: '#ff5533',
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background: #fff1e9;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body class="max-w-md mx-auto p-4">
    <div id="adminLogin" class="bg-white rounded-xl p-6 shadow mt-10">
        <h2 class="text-xl font-bold text-center mb-4">后台登录</h2>
        <input id="adminInput" type="text" placeholder="后台密码" class="w-full border rounded-lg px-3 py-2 mb-4">
        <button onclick="checkAdmin()" class="w-full bg-orangeText text-white py-2 rounded-lg">登录</button>
        <div id="adminErr" class="text-red-500 mt-2 text-center hidden">密码错误</div>
    </div>

    <div id="adminPanel" class="hidden">
        <div class="bg-white rounded-xl p-5 shadow mb-4">
            <h3 class="font-bold text-lg mb-4">新增 / 编辑排队用户</h3>
            <input type="hidden" id="editId">
            <label class="block text-sm text-gray-700 mb-1">访客验证码</label>
            <input id="setCode" class="w-full border rounded-lg px-3 py-2 mb-3">

            <label class="block text-sm text-gray-700 mb-1">桌号</label>
            <input id="setNo" class="w-full border rounded-lg px-3 py-2 mb-3">

            <label class="block text-sm text-gray-700 mb-1">就餐状态</label>
            <select id="setStatus" class="w-full border rounded-lg px-3 py-2 mb-3">
                <option value="0">取号成功</option>
                <option value="1">待叫号</option>
                <option value="2">待就餐</option>
                <option value="3">已过号</option>
            </select>

            <label class="block text-sm text-gray-700 mb-1">剩余桌数（用于进度条）</label>
            <input id="setWaitNum" type="number" class="w-full border rounded-lg px-3 py-2 mb-3">

            <label class="block text-sm text-gray-700 mb-1">预估文字（如：大于30分钟）</label>
            <input id="setWaitText" class="w-full border rounded-lg px-3 py-2 mb-3">

            <label class="block text-sm text-gray-700 mb-1">取号时间（HH:mm）</label>
            <input id="setTakeTime" class="w-full border rounded-lg px-3 py-2 mb-3">

            <label class="block text-sm text-gray-700 mb-1">手机号信息</label>
            <input id="setPhoneLine" class="w-full border rounded-lg px-3 py-2 mb-3">

            <button onclick="saveUser()" class="w-full bg-orangeText text-white py-2 rounded-lg">保存</button>
        </div>

        <div class="bg-white rounded-xl p-5 shadow mb-4">
            <h3 class="font-bold text-lg mb-4">用户列表</h3>
            <div id="userListBox" class="space-y-3"></div>
        </div>
    </div>

<script>
let userList = [];
const statusMap = {
    0:"取号成功",
    1:"待叫号",
    2:"待就餐",
    3:"已过号"
};

async function checkAdmin(){
    const pwd = document.getElementById('adminInput').value.trim();
    try {
        const res = await fetch("/api/admin/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({pwd})
        });
        const ret = await res.json();
        if(ret.ok){
            document.getElementById('adminLogin').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            await loadList();
        }else{
            document.getElementById('adminErr').classList.remove('hidden');
        }
    } catch(e) {
        alert("请求失败！服务未启动/网络异常："+e.message);
        console.error(e);
    }
}

async function loadList(){
    try {
        const res = await fetch("/api/list");
        userList = await res.json();
        renderUserList();
    } catch(e) {
        alert("加载列表失败："+e.message);
        console.error(e);
    }
}

async function saveUser(){
    console.log("执行保存");
    const id = document.getElementById('editId').value;
    const code = document.getElementById('setCode').value.trim();
    const no = document.getElementById('setNo').value.trim();
    const status = document.getElementById('setStatus').value;
    const waitNum = document.getElementById('setWaitNum').value;
    const waitText = document.getElementById('setWaitText').value.trim();
    const takeTime = document.getElementById('setTakeTime').value.trim();
    const phone = document.getElementById('setPhoneLine').value.trim();
    if(!code){alert('验证码不能为空');return;}
    const payload = {id,code,no,status,waitNum,waitText,takeTime,phone};
    try {
        const res = await fetch("/api/save",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        });
        const ret = await res.json();
        if(ret.ok){
            alert("✅ 保存成功");
            clearForm();
            await loadList();
        }else{
            alert("❌ 保存失败：" + (ret.msg || ''));
        }
    } catch(e) {
        alert("保存失败："+e.message);
        console.error(e);
    }
}

function clearForm(){
    document.getElementById('editId').value = '';
    document.getElementById('setCode').value = '';
    document.getElementById('setNo').value = '';
    document.getElementById('setStatus').value = '1';
    document.getElementById('setWaitNum').value = '';
    document.getElementById('setWaitText').value = '';
    document.getElementById('setTakeTime').value = '';
    document.getElementById('setPhoneLine').value = '';
}

function editUserById(itemId){
    const item = userList.find(x=>x.id === itemId);
    if(!item) return;
    document.getElementById('editId').value = item.id;
    document.getElementById('setCode').value = item.code;
    document.getElementById('setNo').value = item.no;
    document.getElementById('setStatus').value = item.status;
    document.getElementById('setWaitNum').value = item.waitNum;
    document.getElementById('setWaitText').value = item.waitText;
    document.getElementById('setTakeTime').value = item.takeTime;
    document.getElementById('setPhoneLine').value = item.phone;
}

async function toggleUser(id){
    try {
        await fetch("/api/toggle",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({id})
        });
        await loadList();
    } catch(e) {
        alert("切换状态失败："+e.message);
        console.error(e);
    }
}

async function delUser(id){
    if(!confirm('确定删除？')) return;
    try {
        await fetch("/api/del",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({id})
        });
        await loadList();
    } catch(e) {
        alert("删除失败："+e.message);
        console.error(e);
    }
}

function cloneUserById(itemId) {
    const item = userList.find(x=>x.id === itemId);
    if(!item) return;
    document.getElementById('editId').value = '';
    document.getElementById('setCode').value = '';
    document.getElementById('setNo').value = item.no;
    document.getElementById('setStatus').value = item.status;
    document.getElementById('setWaitNum').value = item.waitNum;
    document.getElementById('setWaitText').value = item.waitText;
    document.getElementById('setTakeTime').value = item.takeTime;
    document.getElementById('setPhoneLine').value = item.phone;
    alert('✅ 已复制信息，请填写新验证码保存！');
}

function renderUserList(){
    const box = document.getElementById('userListBox');
    box.innerHTML = '';
    userList.forEach(item=>{
        const div = document.createElement('div');
        div.className = 'border p-3 rounded-lg ' + (item.enabled ? '' : 'bg-gray-100');
        div.innerHTML = `
            <p><span class="font-semibold">验证码：</span>${item.code}</p>
            <p><span class="font-semibold">桌号：</span>${item.no}</p>
            <p><span class="font-semibold">就餐状态：</span>${statusMap[item.status]}</p>
            <p><span class="font-semibold">剩余桌数：</span>${item.waitNum}</p>
            <p><span class="font-semibold">状态：</span>${item.enabled ? '✅启用' : '❌已失效'}</p>
            <div class="flex gap-2 mt-3 flex-wrap">
                <button onclick='editUserById(${item.id})' class="px-2 py-1 bg-blue-500 text-white rounded text-sm">编辑</button>
                <button onclick='cloneUserById(${item.id})' class="px-2 py-1 bg-yellow-500 text-white rounded text-sm">复制</button>
                <button onclick="toggleUser(${item.id})" class="px-2 py-1 ${item.enabled ? 'bg-orange-500' : 'bg-green-500'} text-white rounded text-sm">${item.enabled ? '设为失效' : '恢复启用'}</button>
                <button onclick="delUser(${item.id})" class="px-2 py-1 bg-red-500 text-white rounded text-sm">删除</button>
            </div>
        `;
        box.appendChild(div);
    })
}
</script>
</body>
</html>
